version: 2

updates:
  # Workflow actions are pinned to commit SHAs; Dependabot rewrites the SHA and
  # the trailing version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
    ignore:
      # AGP majors need a coordinated Gradle wrapper bump, which Dependabot
      # cannot do; update those by hand.
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
